name: Filler post (cat + light news)

on:
  schedule:
    # 毎時 0 分 (1 時間おき、24 回/日)
    # Tier 2 news (JST 6/10/14/18/22) と重なる時は news + 猫が同時に流れる
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: news-bot-filler
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install httpx feedparser

      - name: Post filler
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOG_LEVEL: INFO
        run: python -m src.filler
